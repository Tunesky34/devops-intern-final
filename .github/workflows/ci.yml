name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check shell syntax
        run: sh -n scripts/sysinfo.sh scripts/healthcheck.sh

      - name: Build application image
        run: docker build --tag nginx-app:ci ./app
